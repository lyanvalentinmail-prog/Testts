  /api/anime/search:
    get:
      operationId: anime.search
      summary: "Busca series de anime por título con filtros de tipo, estado y puntuación."
      description: "Consulta la API pública de Jikan (MyAnimeList) y devuelve una lista normalizada de animes con título, sinopsis corta, puntuación, episodios, géneros, imagen y tráiler. Si el proveedor no responde se devuelve un error 502 explicativo en lugar de datos inventados.\n\nCategoría: **anime**."
      tags:
        - Anime
      security: []
      responses:
        200:
          description: Lista de animes encontrados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: "Parámetros inválidos (por ejemplo `limit` fuera de rango)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Demasiadas peticiones por minuto desde tu IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        502:
          description: Jikan no respondió a tiempo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: anime.search
      x-velora-category: anime
      x-velora-output: json
      parameters:
        - name: q
          in: query
          required: true
          description: Título del anime a buscar.
          schema:
            type: string
            minLength: 1
            maxLength: 80
            default: naruto
            example: naruto
          x-aliases:
            - query
            - query search
        - name: limit
          in: query
          required: false
          description: "Número máximo de resultados (1-25)."
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
            example: 10
          x-aliases:
            - limite
        - name: page
          in: query
          required: false
          description: Número de página (empezando en 1).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
            example: 1
          x-aliases:
            - pagina
        - name: type
          in: query
          required: false
          description: Filtra por formato del anime.
          schema:
            type: string
            enum:
              - tv
              - movie
              - ova
              - special
              - ona
              - music
        - name: status
          in: query
          required: false
          description: Estado de emisión.
          schema:
            type: string
            enum:
              - airing
              - complete
              - upcoming
        - name: minScore
          in: query
          required: false
          description: "Descarta resultados con nota inferior (0-10)."
          schema:
            type: integer
            minimum: 0
            maximum: 10
        - name: orderBy
          in: query
          required: false
          description: Criterio de ordenación.
          schema:
            type: string
            enum:
              - score
              - popularity
              - start_date
              - title
            default: score
        - name: sfw
          in: query
          required: false
          description: Filtra resultados para mayores de edad.
          schema:
            type: boolean
            default: true
