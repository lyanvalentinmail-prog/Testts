                type: string
                format: binary
        400:
          description: URL ausente o no válida (destino no permitido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        413:
          description: La imagen supera los 8 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
