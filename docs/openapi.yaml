      operationId: utils.text
      summary: "Estadísticas, mayúsculas, título, camelCase, snake_case y kebab-case."
      description: "Aplica transformaciones de texto habituales y, con `action=stats`, devuelve recuentos reales: caracteres, palabras, líneas, frases, tiempo de lectura estimado y frecuencia de las palabras más repetidas.\n\nCategoría: **utilidades**."
      tags:
        - Utilidades
      security: []
      responses:
        200:
          description: Texto transformado o estadísticas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Texto vacío o acción desconocida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: utils.text
      x-velora-category: utilidades
      x-velora-output: json
      parameters:
        - name: text
          in: query
          required: true
          description: Texto de entrada.
          schema:
            type: string
            maxLength: 20000
            default: Hola mundo desde Velora API
            example: Hola mundo desde Velora API
          x-aliases:
            - texto
            - q
        - name: action
          in: query
          required: false
          description: Transformación a aplicar.
          schema:
            type: string
            enum:
              - stats
              - upper
              - lower
              - title
              - camel
              - snake
              - kebab
              - reverse
              - trim
            default: stats
          x-aliases:
            - accion
  /api/utils/morse:
    get:
      operationId: utils.morse
      summary: "Traduce texto a Morse y Morse a texto (A-Z, 0-9 y signos)."
      description: "Convierte texto a código Morse internacional separando letras con espacios y palabras con `/`, o decodifica Morse a texto. Las letras no soportadas se marcan con `?` en la codificación y se ignoran al decodificar.\n\nCategoría: **utilidades**."
      tags:
        - Utilidades
      security: []
      responses:
        200:
          description: Resultado de la conversión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Texto vacío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: utils.morse
      x-velora-category: utilidades
      x-velora-output: json
      parameters:
        - name: text
          in: query
          required: true
          description: Texto o código Morse.
          schema:
            type: string
            maxLength: 500
            default: SOS
            example: SOS
          x-aliases:
            - texto
            - q
        - name: action
          in: query
          required: false
          description: Codificar texto a Morse o decodificar Morse.
          schema:
            type: string
            enum:
              - encode
              - decode
            default: encode
          x-aliases:
            - accion
  /api/utils/random:
    get:
      operationId: utils.random
      summary: "Enteros, decimales, colores o cadenas aleatorias con semilla opcional."
      description: "Genera valores con `crypto.randomInt` (sin semilla) o con un PRNG determinista (con `seed`). Admite enteros en un rango, decimales, colores hexadecimales y cadenas alfanuméricas.\n\nCategoría: **utilidades**."
      tags:
        - Utilidades
      security: []
      responses:
        200:
          description: Valores generados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: "Rango inválido (min > max)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: utils.random
      x-velora-category: utilidades
      x-velora-output: json
      parameters:
        - name: type
          in: query
          required: false
          description: Tipo de valor aleatorio.
          schema:
            type: string
            enum:
              - integer
              - decimal
              - color
              - string
            default: integer
        - name: min
          in: query
          required: false
          description: Valor mínimo (enteros y decimales).
          schema:
            type: number
            minimum: -1000000
            maximum: 1000000
            default: 1
            example: 1
        - name: max
          in: query
          required: false
          description: Valor máximo (enteros y decimales).
          schema:
            type: number
            minimum: -1000000
            maximum: 1000000
            default: 100
            example: 100
        - name: count
          in: query
          required: false
          description: Cuántos valores devolver.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
            example: 5
        - name: seed
          in: query
          required: false
          description: Semilla para resultados reproducibles.
          schema:
            type: string
            maxLength: 40
            example: velora
  /api/utils/date:
    get:
      operationId: utils.date
      summary: Fecha y hora actual en cualquier zona horaria IANA.
      description: "Devuelve la fecha actual en la zona indicada (ISO 8601, UTC, hora local formateada y offset), el número de semana ISO y el día del año. Usa `Intl` con base de datos de zonas IANA incluida en Node.js.\n\nCategoría: **utilidades**."
      tags:
        - Utilidades
      security: []
      responses:
        200:
          description: Fecha en distintos formatos y datos derivados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Zona horaria o idioma inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: utils.date
      x-velora-category: utilidades
      x-velora-output: json
      parameters:
        - name: timezone
          in: query
          required: false
          description: "Zona IANA (por ejemplo `America/Montevideo`)."
          schema:
            type: string
            pattern: "^[A-Za-z_+-]+(/[A-Za-z_+-]+)*$"
            default: America/Montevideo
            example: America/Montevideo
          x-aliases:
            - tz
            - zona
        - name: locale
          in: query
          required: false
          description: Código de idioma para el formato largo.
          schema:
            type: string
            pattern: "^[a-z]{2}(-[A-Za-z0-9]{2,8})*$"
            default: "es-UY"
            example: "es-UY"
