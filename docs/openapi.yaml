components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: "X-API-Key"
      description: Solo si el servidor define VELORA_API_KEY.
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          const: true
        data: {}
        meta:
          type: object
          properties:
            requestId:
              type: string
            durationMs:
              type: integer
            cached:
              type: boolean
            timestamp:
              type: string
              format: "date-time"
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
        - meta
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              examples:
                - VALIDATION_ERROR
            message:
              type: string
            details: {}
            hint:
              type: string
        meta:
          type: object
          properties:
            requestId:
              type: string
            durationMs:
              type: integer
            timestamp:
              type: string
              format: "date-time"