openapi: 3.1.0
info:
  title: Velora API
  version: 1.0.0
  summary: "Canvas con plantillas reales, anime, búsquedas, descargas y utilidades."
  description: "API REST pública sin clave (opcionalmente protegida con VELORA_API_KEY). Todas las respuestas JSON usan el sobre `{ success, data, meta }` y los errores `{ success: false, error, meta }`."
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Velora API
    url: "https://github.com/lyanvalentinmail-prog/Testts"
servers:
  - url: "http://localhost:4000"
    description: Servidor actual
tags:
  - name: Canvas
    description: "Composiciones gráficas sobre las plantillas originales de la carpeta «CategoriaCanvas» de Google Drive: carteles, tarjetas de perfil, chats, banners, avatares y efectos. Se renderizan en el servidor con SVG + resvg y se pueden descargar en PNG, JPEG, WebP o SVG."
  - name: Anime
    description: "Búsquedas reales de anime, manga y personajes con la API pública de MyAnimeList (Jikan), más un elenco local curado para gacha, waifus, citas y avatares generados. Jikan no requiere clave."
  - name: Search
    description: "Búsqueda web, imágenes con licencia abierta, letras, Wikipedia, GitHub, libros, noticias, emojis y países. Cada endpoint declara su proveedor, sus límites y su alternativa cuando el proveedor no responde."
  - name: Download
    description: "Descarga de archivos e imágenes públicas con protección SSRF y límites de tamaño, letras sincronizadas de LRCLIB, metadatos de páginas y galería de fotos incluida. Solo fuentes públicas y autorizadas."
  - name: Utilidades
    description: "UUID, contraseñas, hashes, Base64, slugs, colores, texto, fechas por zona horaria y un almacén temporal para probar los métodos POST, PUT y DELETE. Todo se ejecuta en el servidor sin dependencias externas."
  - name: Sistema
    description: "Endpoints de introspección de la plataforma: estado del servidor, métricas en memoria, catálogo navegable, búsqueda de endpoints y especificación OpenAPI 3.1 generada desde el mismo catálogo."
paths:
  /api/health:
    get:
      operationId: system.health
      summary: "Health check con versión, uptime, memoria y número de endpoints."
      description: "Devuelve 200 si el proceso está vivo, con la versión, el entorno, el uptime en segundos, el uso de memoria, la versión de Node y el recuento de endpoints registrados. Pensado para los health checks de Render y Vercel y para monitores externos.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Servidor operativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Parámetros inválidos o petición mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        503:
          description: "Servidor arrancado pero degradado (por ejemplo, sin acceso a assets)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.health
      x-velora-category: sistema
      x-velora-output: json
  /api/stats:
    get:
      operationId: system.stats
      summary: "Contadores de peticiones, errores, caché y tiempos medios."
      description: "Expone métricas acumuladas desde el arranque del proceso: total de peticiones, respuestas por código, errores, tiempo medio de respuesta, aciertos de caché y tamaño de la caché. En serverless son métricas de la instancia actual.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Métricas de la instancia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Parámetros inválidos o petición mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.stats
      x-velora-category: sistema
      x-velora-output: json
  /api/categories:
    get:
      operationId: system.categories
      summary: Lista las categorías con su recuento real de endpoints.
      description: "Devuelve las seis categorías de la plataforma con descripción, icono, color de acento y el número de endpoints que contiene cada una, calculado directamente del catálogo.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Categorías con sus recuentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Parámetros inválidos o petición mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.categories
      x-velora-category: sistema
      x-velora-output: json
  /api/endpoints:
    get:
      operationId: system.endpoints
      summary: "Catálogo completo en JSON, filtrable por categoría, método y texto."
      description: "Devuelve el catálogo completo (misma fuente que la web y OpenAPI): nombre, ruta, método, categoría, parámetros, códigos de estado y ejemplos. Admite `q`, `category` y `method` para filtrar, y `format=summary` para una versión ligera.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Catálogo filtrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Parámetros inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.endpoints
      x-velora-category: sistema
      x-velora-output: json
      parameters:
        - name: q
          in: query
          required: false
          description: "Filtra por nombre, ruta o descripción."
          schema:
            type: string
            maxLength: 80
          x-aliases:
            - query
            - buscar
        - name: category
          in: query
          required: false
          description: Filtra por categoría.
          schema:
            type: string
            enum:
              - canvas
              - anime
              - search
              - download
              - utilidades
              - sistema
          x-aliases:
            - categoria
        - name: method
          in: query
          required: false
          description: Filtra por método HTTP.
          schema:
            type: string
            enum:
              - GET
              - POST
              - PUT
              - DELETE
        - name: format
          in: query
          required: false
          description: "`full` devuelve el catálogo completo; `summary`, solo datos básicos."
          schema:
            type: string
            enum:
              - full
              - summary
            default: full
        - name: limit
          in: query
          required: false
          description: "Número máximo de resultados (1-100)."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
            example: 100
          x-aliases:
            - limite
  /api/endpoints/{id}:
    get:
      operationId: system.endpoint
      summary: Documentación de un endpoint concreto por su identificador.
      description: "Devuelve la definición completa del endpoint (`id` estable como `anime.search` o `canvas.brat`), incluidos parámetros, ejemplos, códigos de estado y notas. Es el mismo objeto que usa la web para renderizar la documentación.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Definición del endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Parámetros inválidos o petición mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        404:
          description: No existe un endpoint con ese ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.endpoint
      x-velora-category: sistema
      x-velora-output: json
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador estable del endpoint.
          schema:
            type: string
            pattern: "^[a-zA-Z0-9.-]{2,60}$"
            example: anime.search
  /api/openapi.json:
    get:
      operationId: system.openapi
      summary: Especificación OpenAPI 3.1 generada desde el catálogo.
      description: "Genera un documento OpenAPI 3.1 completo (servidores, tags, paths, parámetros, requestBody, respuestas y esquemas) a partir de las mismas definiciones que usa la web. Se puede importar en Postman, Insomnia o Swagger UI.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Documento OpenAPI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Formato no soportado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.openapi
      x-velora-category: sistema
      x-velora-output: json
      parameters:
        - name: format
          in: query
          required: false
          description: "`json` para OpenAPI JSON o `yaml` para una versión YAML simplificada."
          schema:
            type: string
            enum:
              - json
              - yaml
            default: json
  /api/canvas:
    get:
      operationId: system.canvases
      summary: Lista todas las plantillas de canvas con sus parámetros y vista previa.
      description: "Devuelve el catálogo de canvas con grupo, dimensiones, parámetros aceptados, URL de la plantilla original y URL de vista previa. Permite construir galerías dinámicas sin conocer cada canvas de antemano.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Listado de canvas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Grupo no válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.canvases
      x-velora-category: sistema
      x-velora-output: json
      parameters:
        - name: group
          in: query
          required: false
          description: Filtra por grupo de canvas.
          schema:
            type: string
            enum:
              - texto
              - imagenes
              - perfiles
              - edicion
              - fondos
              - avatares
              - efectos
              - banners
              - plantillas
          x-aliases:
            - grupo
  /api/canvas/{slug}/preview:
    get:
      operationId: system.template
      summary: Imagen de la plantilla original (JPG/PNG) usada por un canvas.
      description: "Devuelve el archivo original de la plantilla tal y como se descargó de Google Drive, sin composición. Sirve para las vistas previas de la galería y para comparar el resultado con la plantilla.\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Imagen de la plantilla.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        400:
          description: Parámetros inválidos o petición mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        404:
          description: El canvas o la plantilla no existen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.template
      x-velora-category: sistema
      x-velora-output: image
      parameters:
        - name: slug
          in: path
          required: true
          description: Identificador del canvas.
          schema:
            type: string
            pattern: "^[a-z0-9-]{2,40}$"
            example: brat
        - name: width
          in: query
          required: false
          description: Ancho de la vista previa en píxeles.
          schema:
            type: integer
            minimum: 64
            maximum: 1280
            default: 480
            example: 480
  /api/echo:
    get:
      operationId: system.echo
      summary: "Devuelve método, ruta, cabeceras y parámetros recibidos."
      description: "Endpoint de depuración que refleja lo que ha recibido el servidor: método, path, query, cabeceras seleccionadas e IP. No devuelve cookies ni cabeceras de autorización completas (se enmascaran).\n\nCategoría: **sistema**."
      tags:
        - Sistema
      security: []
      responses:
        200:
          description: Datos de la petición.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        400:
          description: Parámetros inválidos o petición mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Límite de peticiones superado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: system.echo
      x-velora-category: sistema
      x-velora-output: json
      parameters:
        - name: format
          in: query
          required: false
          description: Nivel de detalle de la respuesta.
          schema:
            type: string
            enum:
              - basic
              - headers
            default: basic
  /api/canvas/brat:
    get:
      operationId: canvas.brat
      summary: "El cartel BRAT: fondo de color plano con el texto en negrita y desenfoque. Personaliza fondo, color, tamaño y desenfoque."
      description: "El cartel BRAT: fondo de color plano con el texto en negrita y desenfoque. Personaliza fondo, color, tamaño y desenfoque. Se compone sobre la plantilla original «brat.jpg» (736×736 px) procedente de la carpeta «CategoriasCanvas» de Google Drive. El resultado se rasteriza en el servidor con resvg y se devuelve como imagen.\n\nCategoría: **canvas**."
      tags:
        - Canvas
      security: []
      responses:
        200:
          description: Imagen generada en el formato solicitado (PNG por defecto).
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        400:
          description: "Parámetros inválidos (texto vacío, color no válido, tamaño fuera de rango)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        413:
          description: La imagen enviada supera el límite de 8 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        422:
          description: La imagen remota no se pudo descargar o no es válida (se usa un marcador de posición).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Demasiadas peticiones por minuto desde tu IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Fallo inesperado al renderizar la plantilla.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: canvas.brat
      x-velora-category: canvas
      x-velora-output: image
      parameters:
        - name: text
          in: query
          required: true
          description: Texto que se dibuja en la plantilla. Admite varias líneas y se ajusta automáticamente.
          schema:
            type: string
            minLength: 1
            maxLength: 220
            default: "you're here with me:3"
            example: "you're here with me:3"
          x-aliases:
            - texto
            - q
            - mensaje
            - message
        - name: color
          in: query
          required: false
          description: "Color del texto en hexadecimal (#ffffff) o nombre CSS (white, tomato…)."
          schema:
            type: string
            pattern: "^(#[0-9a-fA-F]{3,8}|[a-zA-Z]{3,20}|rgba?\\([^)]*\\))$"
            default: "#101010"
            example: "#111111"
        - name: background
          in: query
          required: false
          description: Color de relleno de la zona de contenido.
          schema:
            type: string
            pattern: "^(#[0-9a-fA-F]{3,8}|[a-zA-Z]{3,20}|rgba?\\([^)]*\\))$"
            default: "#ffffff"
            example: "#ffffff"
          x-aliases:
            - fondo
            - bg
        - name: fontSize
          in: query
          required: false
          description: Tamaño de la tipografía principal en píxeles (sobre el ancho de referencia).
          schema:
            type: integer
            minimum: 16
            maximum: 220
            default: 78
            example: 78
        - name: width
          in: query
          required: false
          description: Ancho de salida en píxeles.
          schema:
            type: integer
            minimum: 120
            maximum: 2048
            default: 736
            example: 736
        - name: height
          in: query
          required: false
          description: Alto de salida en píxeles.
          schema:
            type: integer
            minimum: 120
            maximum: 2048
            default: 736
            example: 736
        - name: format
          in: query
          required: false
          description: "Formato del archivo generado: png, jpeg, webp, svg."
          schema:
            type: string
            enum:
              - png
              - jpeg
              - webp
              - svg
            default: png
            example: png
          x-aliases:
            - formato
        - name: quality
          in: query
          required: false
          description: "Calidad de compresión para JPEG y WebP (1-100). Se ignora en PNG y SVG."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 90
            example: 90
        - name: download
          in: query
          required: false
          description: "Si es true, la respuesta incluye Content-Disposition: attachment."
          schema:
            type: boolean
            default: false
            example: false
  /api/canvas/bratwebp:
    get:
      operationId: canvas.bratwebp
      summary: Texto BRAT sobre fondo transparente para usar como sticker. Devuelve WebP con canal alfa (o SVG/PNG con transparencia).
      description: "Texto BRAT sobre fondo transparente para usar como sticker. Devuelve WebP con canal alfa (o SVG/PNG con transparencia). Se compone sobre la plantilla original «brat.jpg (fondo transparente)» (736×736 px) procedente de la carpeta «CategoriasCanvas» de Google Drive. El resultado se rasteriza en el servidor con resvg y se devuelve como imagen.\n\nCategoría: **canvas**."
      tags:
        - Canvas
      security: []
      responses:
        200:
          description: Imagen generada en el formato solicitado (PNG por defecto).
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        400:
          description: "Parámetros inválidos (texto vacío, color no válido, tamaño fuera de rango)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        413:
          description: La imagen enviada supera el límite de 8 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        422:
          description: La imagen remota no se pudo descargar o no es válida (se usa un marcador de posición).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          description: Demasiadas peticiones por minuto desde tu IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        500:
          description: Fallo inesperado al renderizar la plantilla.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-velora-id: canvas.bratwebp
      x-velora-category: canvas
      x-velora-output: image
      parameters:
        - name: text
          in: query
          required: true
          description: Texto que se dibuja en la plantilla. Admite varias líneas y se ajusta automáticamente.
          schema:
            type: string
            minLength: 1
            maxLength: 220
            default: sticker
            example: sticker
          x-aliases:
            - texto
            - q
            - mensaje
            - message
        - name: color
          in: query
          required: false
          description: "Color del texto en hexadecimal (#ffffff) o nombre CSS (white, tomato…)."
          schema:
            type: string
            pattern: "^(#[0-9a-fA-F]{3,8}|[a-zA-Z]{3,20}|rgba?\\([^)]*\\))$"
            default: "#101010"
            example: "#111111"
        - name: fontSize
          in: query
          required: false
          description: Tamaño de la tipografía principal en píxeles (sobre el ancho de referencia).
          schema:
            type: integer
            minimum: 16
            maximum: 200
            default: 74
            example: 74
        - name: transparent
          in: query
          required: false
          description: Si es false se usa el color de fondo indicado en background.
          schema:
            type: boolean
            default: true
            example: true
        - name: background
          in: query
          required: false
          description: Color de relleno de la zona de contenido.
          schema:
            type: string
            pattern: "^(#[0-9a-fA-F]{3,8}|[a-zA-Z]{3,20}|rgba?\\([^)]*\\))$"
            default: "#8ace00"
            example: "#8ace00"
          x-aliases:
            - fondo
            - bg
        - name: width
          in: query
          required: false
          description: Ancho de salida en píxeles.
          schema:
            type: integer
            minimum: 120
            maximum: 2048
            default: 512
            example: 512
